databaseChangeLog:
  - changeSet:
      id: 004-create-accounts-table
      author: Denis
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: account_number
                  type: varchar(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: currency_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(10,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false